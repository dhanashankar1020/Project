name: shankar2
description: "Offline Disaster Helper - Emergency assistance app with SOS, first aid, disaster guides, emergency contacts, and safe places."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  url_launcher: ^6.3.2

  geolocator: ^14.0.2

  permission_handler: ^12.0.1

  shared_preferences: ^2.5.3

  intl: ^0.20.2

  google_generative_ai: ^0.4.7

  speech_to_text: ^7.0.0

  flutter_map: ^7.0.2

  latlong2: ^0.9.1
  http: ^1.2.0

  sqflite: ^2.4.2

  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/safe_places/
  